stages: [lint, test, build, deploy]

default:
  image: python:3.12-slim
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths: [.cache/pip]
  before_script:
    - pip install --upgrade pip
    - pip install -e ".[dev]"

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

ruff:
  stage: lint
  script:
    - ruff check .

mypy:
  stage: lint
  allow_failure: true
  script:
    - mypy upshift

pytest:
  stage: test
  script:
    - pytest -q --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

web:
  stage: build
  image: node:22-alpine
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths: [web/node_modules]
  before_script: []
  script:
    - cd web
    - npm install --no-audit --no-fund
    - npm run build
  artifacts:
    paths: [web/dist]
    expire_in: 1 week

# Mission Control in recorded-replay mode, served by GitLab Pages at $0: the runs under
# web/public/runs/ (written by `python -m upshift export`) are bundled into the build.
pages:
  stage: deploy
  image: node:22-alpine
  needs: [web]
  before_script: []
  script:
    - rm -rf public && mv web/dist public
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
