stages: [lint, test]

default:
  image: python:3.12-slim
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths: [.cache/pip]
  before_script:
    - pip install --upgrade pip
    - pip install -e ".[dev]"

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

ruff:
  stage: lint
  script:
    - ruff check .

mypy:
  stage: lint
  allow_failure: true
  script:
    - mypy upshift

pytest:
  stage: test
  script:
    - pytest -q --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
