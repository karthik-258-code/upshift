stages: [lint, test, build, deploy]

# Dogfood: the reusable template, pointed at the demo repo in this project. Manual, and it
# needs NEBIUS_API_KEY, TAVILY_API_KEY and GITLAB_TOKEN as CI/CD variables to do anything;
# including it here at least proves the template parses on every pipeline.
include:
  - local: templates/upshift.yml
    inputs:
      package: pydantic
      repo_path: $CI_PROJECT_DIR/demo-repos/pyshop-legacy
      upshift_install: $CI_PROJECT_DIR
      target_project: gitlab-ai-hackathon/transcend-october-2026/43491832/pyshop-legacy

default:
  image: python:3.12-slim
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths: [.cache/pip]
  before_script:
    - pip install --upgrade pip
    - pip install -e ".[dev]"

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

ruff:
  stage: lint
  script:
    - ruff check .

mypy:
  stage: lint
  allow_failure: true
  script:
    - mypy upshift

pytest:
  stage: test
  script:
    - pytest -q --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

web:
  stage: build
  image: node:22-alpine
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths: [web/node_modules]
  before_script: []
  script:
    - cd web
    - npm install --no-audit --no-fund
    - npm run build
  artifacts:
    paths: [web/dist]
    expire_in: 1 week

# Mission Control in recorded-replay mode, served by GitLab Pages at $0: the runs under
# web/public/runs/ (written by `python -m upshift export`) are bundled into the build.
pages:
  stage: deploy
  image: node:22-alpine
  needs: [web]
  before_script: []
  script:
    - rm -rf public && mv web/dist public
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
