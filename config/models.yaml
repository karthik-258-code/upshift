# Upshift model catalog.
# IDs, prices and context sizes come from research-brief.md (Token Factory public pricing).
# Change values here, never in code. Run `python scripts/probe_models.py` to verify real
# capabilities per model; it writes config/capabilities.json which the router treats as truth.
# Probe on 2026-10-19: lightning, super and ultra passed every capability. The Nano ID in the
# research brief was wrong (lowercase); the correct ID below comes from `probe_models.py --list`.
base_url: https://api.tokenfactory.us-central1.nebius.com/v1/

models:
  lightning:
    id: nvidia/Nemotron-3_5-Lightning
    tier: 0
    context_tokens: 1024000
    input_price_per_m: 0.06
    output_price_per_m: 0.24
    documented_capabilities: [chat, tool_calling, parallel_tool_calls, json_object, json_schema]
    notes: Primary tier-0 model. Nano pricing, 1M context. Classification, ranking, triage, long changelog ingestion.

  nano:
    id: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B
    tier: 0
    context_tokens: 262000
    input_price_per_m: 0.06
    output_price_per_m: 0.24
    optional: true
    documented_capabilities: [chat, tool_calling, json_object]
    notes: Fallback tier-0 model. Re-run `probe_models.py --only nano` after changing this ID.

  super:
    id: nvidia/nemotron-3-super-120b-a12b
    tier: 1
    context_tokens: 256000
    input_price_per_m: 0.30
    output_price_per_m: 0.90
    documented_capabilities: [chat, tool_calling, parallel_tool_calls, json_object, json_schema]
    notes: Code generation (attempts 1-2), MR writing, complex tool use.

  ultra:
    id: nvidia/Nemotron-3-Ultra-550b-a55b
    tier: 2
    context_tokens: 1024000
    input_price_per_m: 1.00
    output_price_per_m: 3.00
    documented_capabilities: [chat, tool_calling, parallel_tool_calls, json_object, json_schema]
    notes: Third-attempt patches with whole-repo context and final adversarial review.
